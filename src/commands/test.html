<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Player Stats Card</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                position: relative;
            }

            .bg-image {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: 0;
            }

            .overlay {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
                background-color: rgba(15, 15, 15, 0.6);
            }

            .title-bar {
                background-color: rgba(15, 15, 15, 0.6);
                color: #ffffff;
                font-size: 35px;
                font-weight: 500;
                text-align: center;
            }

            .container {
                display: flex;
                flex: 1;
                width: 100%;
            }

            .profile-section {
                width: 40%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }

            .username {
                color: #ffffff;
                font-size: 50px;
                font-weight: 500;
            }

            .avatar {
                height: 350px;
                object-fit: contain;
            }

            .stats-section {
                width: 60%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 50px;
            }

            .stats-row {
                display: flex;
                gap: 50px;
            }

            .stat-card {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: rgba(31, 31, 31, 0.75);
                border: 1px solid rgba(60, 60, 56, 0.5);
                border-radius: 6px;
                width: 280px;
                padding: 16px 12px;
                text-align: center;
            }

            .stat-label {
                color: #8c8c8a;
                font-size: 22px;
                font-weight: 500;
                margin-top: 10px;
            }

            .stat-value {
                color: #ffffff;
                font-size: 36px;
                font-weight: 600;
                margin-top: 8px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <img
            class="bg-image"
            src="https://media.discordapp.net/attachments/1255321257956605966/1544120995160531064/2024-04-27_17.06.35.png?ex=6a9bf77d&is=6a9aa5fd&hm=834f0764419d0133fb2f84a9989d551248f946ad6217492916d1f6ec38a892d1&=&format=webp&quality=lossless"
            alt="Background"
        />

        <div class="overlay">
            <div class="title-bar">Veda Overview</div>

            <div class="container">
                <div class="profile-section">
                    <h1 class="username">pixlze</h1>
                    <img
                        class="avatar"
                        src="https://mc-heads.net/body/pixlze"
                        alt="Minecraft Skin"
                    />
                </div>

                <div class="stats-section">
                    <div class="stats-row">
                        <div class="stat-card">
                            <span class="stat-label">Weight</span>
                            <span class="stat-value">&lt;number&gt;</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Total Completions</span>
                            <span class="stat-value">&lt;number&gt;</span>
                        </div>
                    </div>

                    <div class="stats-row">
                        <div class="stat-card">
                            <span class="stat-label">Estimated Playtime</span>
                            <span class="stat-value">&lt;number&gt;</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Most Played</span>
                            <span class="stat-value">&lt;number&gt;</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
